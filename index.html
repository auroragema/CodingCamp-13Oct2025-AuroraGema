<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern To-Do List</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1 class="title">
                My Tasks
            </h1>
            <p class="subtitle">Organize your day, achieve your goals</p>
        </div>

        <div class="todo-card">
            <form id="todoForm" class="todo-form">
                <div class="input-group">
                    <div class="input-wrapper">
                        <label for="todoInput">Task Description</label>
                        <input 
                            type="text" 
                            id="todoInput" 
                            placeholder="What do you need to do?" 
                            required
                        >
                    </div>
                    
                    <div class="input-wrapper">
                        <label for="dateInput">Due Date</label>
                        <input 
                            type="date" 
                            id="dateInput" 
                            required
                        >
                    </div>
                    
                    <button type="submit" class="btn-add">
                        <span>+</span> Add Task
                    </button>
                </div>
            </form>

            <div class="filter-section">
                <h3 class="filter-title">FILTER</h3>
                <div class="filter-buttons">
                    <button class="filter-btn active" data-filter="all">All Tasks</button>
                    <button class="filter-btn" data-filter="today">Today</button>
                    <button class="filter-btn" data-filter="upcoming">Upcoming</button>
                    <button class="filter-btn" data-filter="completed">Completed</button>
                </div>
                <button class="btn-delete-all" id="deleteAllBtn">
                    Delete All
                </button>
            </div>

            <div class="todo-header">
                <div class="col-task">TASK</div>
                <div class="col-date">DUE DATE</div>
                <div class="col-status">STATUS</div>
                <div class="col-actions">ACTIONS</div>
            </div>

            <div id="todoList" class="todo-list">
                <div class="empty-state">
                    <p>No tasks found</p>
                    <small>Add your first task to get started!</small>
                </div>
            </div>
        </div>

        <div class="footer">
            <p>Made with for productivity</p>
        </div>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
